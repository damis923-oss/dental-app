<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказ-наряд лаборатории</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dcdfe6;
      --primary-color: #3182ce;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 { font-size: 16px; margin-top: 0; margin-bottom: 12px; color: #2d3748; border-bottom: 2px solid #edf2f7; padding-bottom: 6px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #4a5568; }
    input, select, textarea {
      width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 14px; margin-bottom: 12px;
    }
    
    /* Зубная формула */
    .arch-title { font-size: 12px; text-align: center; color: #718096; margin: 4px 0; font-weight: bold; }
    .dental-grid { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .tooth-btn {
      width: 38px; height: 38px; border: 2px solid #cbd5e0; background: #fff; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: bold; font-size: 12px; cursor: pointer; transition: all 0.2s; user-select: none;
    }
    .tooth-btn .type-tag { font-size: 7px; text-transform: uppercase; margin-top: 1px; overflow: hidden; max-width: 34px; text-overflow: ellipsis; white-space: nowrap; }

    /* Цвета конструкций */
    .type-crown_full { background-color: #805ad5 !important; color: white; border-color: #6b46c1; }
    .type-pontic_full { background-color: #e53e3e !important; color: white; border-color: #c53030; }
    .type-crown_layer { background-color: #dd6b20 !important; color: white; border-color: #c05621; }
    .type-pontic_layer { background-color: #d69e2e !important; color: white; border-color: #b7791f; }
    .type-veneer { background-color: #319795 !important; color: white; border-color: #2c7a7b; }
    .type-veneer_layer { background-color: #3182ce !important; color: white; border-color: #2b6cb0; }
    .type-splint { background-color: #4a5568 !important; color: white; border-color: #2d3748; }
    .type-all_on_x { background-color: #e2e8f0 !important; color: #1a202c; border-color: #cbd5e0; }
    .type-waxup { background-color: #38a169 !important; color: white; border-color: #2f855a; }

    /* Модальное окно */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .type-option { padding: 10px; margin: 4px 0; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; text-align: center; border: 1px solid #e2e8f0; }

    .submit-btn { width: 100%; background-color: #38a169; color: white; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h2>👤 Информация о пациенте</h2>
    <label>ФИО Пациента</label>
    <input type="text" id="patient" placeholder="Иванов И.И.">
    <label>Дата приёма</label>
    <input type="date" id="date">
  </div>

  <div class="card">
    <h2>🦷 Индикация (Выбор зубов)</h2>
    <div class="arch-title">Верхняя челюсть</div>
    <div class="dental-grid" id="upper-arch"></div>
    <div class="arch-title">Нижняя челюсть</div>
    <div class="dental-grid" id="lower-arch"></div>
  </div>

  <div class="card">
    <h2>🧪 Общие параметры</h2>
    <label>Материал</label>
    <select id="material">
      <option value="Диоксид циркония">Диоксид циркония</option>
      <option value="E-max">E-max</option>
      <option value="PMMA (Временная)">PMMA (Временная)</option>
      <option value="Металлокерамика">Металлокерамика</option>
      <option value="КХС / ТИТАН">КХС / ТИТАН</option>
    </select>

    <label>Цвет (Шкала Vita)</label>
    <select id="color">
      <option value="A1">A1</option><option value="A2">A2</option><option value="A3">A3</option><option value="A3.5">A3.5</option>
      <option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option><option value="D2">D2</option>
      <option value="Bleach 1">Bleach 1</option><option value="Bleach 2">Bleach 2</option>
    </select>

    <label>Комментарий / Пожелания</label>
    <textarea id="comment" rows="2" placeholder="Особенности прикуса, контакты и т.д."></textarea>
  </div>

  <button class="submit-btn" onclick="submitOrder()">Отправить заказ в лабораторию</button>

  <!-- Модальное окно выбора типа -->
  <div class="modal" id="typeModal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-top:0; text-align:center;">Выберите конструкцию</h3>
      <div id="typeOptions"></div>
      <button onclick="closeModal()" style="width:100%; padding:8px; margin-top:10px; border-radius:6px; border:1px solid #ccc; background:#f7fafc;">Отмена</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const upperTeeth = [18,17,16,15,14,13,12,11, 21,22,23,24,25,26,27,28];
    const lowerTeeth = [48,47,46,45,44,43,42,41, 31,32,33,34,35,36,37,38];

    const workTypes = [
      { id: 'crown_full', title: 'Коронка полная анатомия', class: 'type-crown_full' },
      { id: 'pontic_full', title: 'Подвесной зуб полная анатомия', class: 'type-pontic_full' },
      { id: 'crown_layer', title: 'Коронка с нанесением', class: 'type-crown_layer' },
      { id: 'pontic_layer', title: 'Подвесной зуб с нанесением', class: 'type-pontic_layer' },
      { id: 'veneer', title: 'Винир', class: 'type-veneer' },
      { id: 'veneer_layer', title: 'Винир с нанесением', class: 'type-veneer_layer' },
      { id: 'splint', title: 'Сплинт', class: 'type-splint' },
      { id: 'all_on_x', title: 'Конструкция Всё на 4 / Всё на 6', class: 'type-all_on_x' },
      { id: 'waxup', title: 'Восковое моделирование (Wax-up)', class: 'type-waxup' },
      { id: 'none', title: '❌ Снять выбор', class: '' }
    ];

    let selectedTeeth = {}; // { 15: { typeId: 'crown_full', title: 'Коронка полная анатомия' } }
    let currentActiveTooth = null;

    function renderArch(teeth, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      teeth.forEach(tooth => {
        const btn = document.createElement('div');
        btn.className = 'tooth-btn';
        btn.id = `tooth-${tooth}`;
        btn.innerHTML = `<span>${tooth}</span><span class="type-tag" id="tag-${tooth}"></span>`;
        btn.onclick = () => openModal(tooth);
        container.appendChild(btn);
      });
    }

    function openModal(tooth) {
      currentActiveTooth = tooth;
      document.getElementById('modalTitle').innerText = `Зуб №${tooth}`;
      const optionsContainer = document.getElementById('typeOptions');
      optionsContainer.innerHTML = '';

      workTypes.forEach(opt => {
        const item = document.createElement('div');
        item.className = `type-option ${opt.class}`;
        item.innerText = opt.title;
        item.onclick = () => selectType(opt);
        optionsContainer.appendChild(item);
      });

      document.getElementById('typeModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('typeModal').style.display = 'none';
    }

    function selectType(option) {
      const btn = document.getElementById(`tooth-${currentActiveTooth}`);
      const tag = document.getElementById(`tag-${currentActiveTooth}`);

      // Очистка предыдущих классов
      workTypes.forEach(t => { if(t.class) btn.classList.remove(t.class); });

      if (option.id === 'none') {
        delete selectedTeeth[currentActiveTooth];
        tag.innerText = '';
      } else {
        selectedTeeth[currentActiveTooth] = option;
        btn.classList.add(option.class);
        tag.innerText = option.title.split(' ')[0];
      }
      closeModal();
    }

    function submitOrder() {
      const patient = document.getElementById('patient').value.trim();
      if (!patient) { alert('Укажите ФИО пациента!'); return; }
      if (Object.keys(selectedTeeth).length === 0) { alert('Выберите хотя бы один зуб!'); return; }

      const payload = {
        patient: patient,
        date: document.getElementById('date').value || 'Не указана',
        teeth: selectedTeeth,
        material: document.getElementById('material').value,
        color: document.getElementById('color').value,
        comment: document.getElementById('comment').value.trim()
      };

      tg.sendData(JSON.stringify(payload));
    }

    document.getElementById('date').valueAsDate = new Date();
    renderArch(upperTeeth, 'upper-arch');
    renderArch(lowerTeeth, 'lower-arch');
  </script>
</body>
</html>
